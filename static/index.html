<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Monitor</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="screen">
      <div class="primary-panel">
        <header class="topbar">
          <div class="device-stack">
            <div class="device-row" id="cpuDevice">
              <img id="cpuLogo" class="device-logo" alt="">
              <div>
                <p class="device-label">CPU</p>
                <h1 id="cpuName">CPU</h1>
              </div>
            </div>
            <div class="device-row" id="gpuDevice">
              <img id="gpuLogo" class="device-logo" alt="">
              <div>
                <p class="device-label">GPU</p>
                <h1 id="gpuName">GPU</h1>
              </div>
            </div>
          </div>
          <button id="settingsButton" class="icon-button" type="button" title="设置" aria-label="设置">⚙</button>
        </header>

        <section class="fps-panel">
          <div class="fps-value">
            <span id="fpsValue">--</span>
            <small>FPS</small>
          </div>
          <div class="fps-meta">
            <span id="frameTime">帧生成 --</span>
            <span id="lowFps">1% Low --</span>
            <span id="avgFps">平均 --</span>
          </div>
        </section>
      </div>

      <section id="sensorGrid" class="sensor-grid"></section>

      <footer class="statusbar">
        <span id="updatedAt">--</span>
        <span id="sourceStatus">正在连接数据源</span>
      </footer>
    </main>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
      <div class="settings-header">
        <h2 id="settingsTitle">设置</h2>
        <button id="closeSettings" class="icon-button" type="button" title="关闭" aria-label="关闭">×</button>
      </div>

      <label class="field">
        <span id="refreshLabel">刷新间隔（毫秒）</span>
        <input id="refreshInterval" type="number" min="250" step="250">
      </label>

      <label class="field">
        <span id="temperatureLabel">温度单位</span>
        <select id="temperatureUnit">
          <option value="C">°C</option>
          <option value="F">°F</option>
        </select>
      </label>

      <label class="field">
        <span id="languageLabel">语言</span>
        <select id="languageSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>

      <div class="sensor-picker">
        <div class="picker-title">
          <span id="displayItemsLabel">显示项目</span>
          <button id="selectAllSensors" type="button">全选</button>
        </div>
        <div id="sensorOptions" class="sensor-options"></div>
      </div>

      <button id="saveSettings" class="save-button" type="button">保存</button>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
